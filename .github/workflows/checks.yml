name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race -count=1 -timeout 20m ./...
